name: Generate stats images

on:
    push:
        branches: [main]
        paths:
            - ".github/workflows/generate_readme_stats.yml"
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Generate general stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&card_width=650
                  path: profile/general-stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Generate lang stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: username=${{ github.repository_owner }}&show_icons=true&layout=donut&theme=tokyonight&card_width=320
                  path: profile/lang-stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fail_on_error: true

            - name: Update README cache key
              shell: bash
              run: |
                  set -euo pipefail

                  VERSION="${{ github.run_id }}"

                  perl -0777 -i -pe 's#raw\.githubusercontent\.com/FreddyMSchubert/FreddyMSchubert/[^/]+/profile/general-stats(?:-[0-9]+)?\.svg(?:\?v=[0-9]+)?#raw.githubusercontent.com/FreddyMSchubert/FreddyMSchubert/main/profile/general-stats.svg?v='"${VERSION}"'#g' README.md
                  perl -0777 -i -pe 's#raw\.githubusercontent\.com/FreddyMSchubert/FreddyMSchubert/[^/]+/profile/lang-stats(?:-[0-9]+)?\.svg(?:\?v=[0-9]+)?#raw.githubusercontent.com/FreddyMSchubert/FreddyMSchubert/main/profile/lang-stats.svg?v='"${VERSION}"'#g' README.md

            - name: Commit and push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git add README.md profile/*.svg
                  git diff --cached --quiet || git commit -m "chore: update stats images (cache-bust)"
                  git push
