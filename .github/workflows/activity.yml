name: 🛠️ Activity Widget
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: readme-main-writers
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run the Activity Widget Action
        uses: FreddyMSchubert/github-activity-timeline@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: "FreddyMSchubert"
          max_items: "12"
          time_zone: "Europe/Berlin"
          date_format: "DD.MM.YYYY"
          event_templates: >
            {
              "issues_opened": "<li>⚠️ <b>{{human_date}}</b>: Opened issue <a href=\\\"{{payload.issue.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.issue.number}}</a>{{(() => { const clean = s => (s || '').replace(/https?:\\/\\/[^\\s]+/gi, '*').replace(/(\\r\\n|\\n|\\r)/gm, ' ').trim(); const title = clean(payload.issue.title); const body = clean(payload.issue.body); const ctx = title + (body ? ' – ' + body : ''); return ctx ? ': <i>“' + (ctx.length > 50 ? ctx.slice(0,50) + '…' : ctx) + '”</i>' : ''; })()}}</li>",
              "issues_closed": "<li>✅ <b>{{human_date}}</b>: Closed issue <a href=\\\"{{payload.issue.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.issue.number}}</a>{{(() => { const clean = s => (s || '').replace(/https?:\\/\\/[^\\s]+/gi, '*').replace(/(\\r\\n|\\n|\\r)/gm, ' ').trim(); const title = clean(payload.issue.title); const body = clean(payload.issue.body); const ctx = title + (body ? ' – ' + body : ''); return ctx ? ': <i>“' + (ctx.length > 50 ? ctx.slice(0,50) + '…' : ctx) + '”</i>' : ''; })()}}</li>",
              "issue_commented": "<li>💬 <b>{{human_date}}</b>: Commented on issue <a href=\\\"{{payload.comment.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.issue.number}}</a>{{(() => { const clean = s => (s || '').replace(/https?:\\/\\/[^\\s]+/gi, '*').replace(/(\\r\\n|\\n|\\r)/gm, ' ').trim(); const snippet = clean(payload.comment.body); return snippet ? ': <i>“' + (snippet.length > 50 ? snippet.slice(0,50) + '…' : snippet) + '”</i>' : ''; })()}}</li>",
              "pr_opened": "<li>🚀 <b>{{human_date}}</b>: Opened PR <a href=\\\"{{payload.pull_request.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.pull_request.number}}</a>{{(() => { const clean = s => (s || '').replace(/https?:\\/\\/[^\\s]+/gi, '*').replace(/(\\r\\n|\\n|\\r)/gm, ' ').trim(); const title = clean(payload.pull_request.title); const body = clean(payload.pull_request.body); const ctx = title + (body ? ' – ' + body : ''); return ctx ? ': <i>“' + (ctx.length > 50 ? ctx.slice(0,50) + '…' : ctx) + '”</i>' : ''; })()}}</li>",
              "pr_merged": "<li>🌕 <b>{{human_date}}</b>: Merged PR <a href=\\\"{{payload.pull_request.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.pull_request.number}}</a></li>",
              "pr_closed": "<li>💥 <b>{{human_date}}</b>: Closed PR <a href=\\\"{{payload.pull_request.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.pull_request.number}}</a> without merge</li>",
              "pr_review_approved": "<li>👍 <b>{{human_date}}</b>: Approved PR <a href=\\\"{{payload.pull_request.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.pull_request.number}}</a></li>",
              "pr_review_changes_requested": "<li>👎 <b>{{human_date}}</b>: Requested changes on PR <a href=\\\"{{payload.pull_request.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.pull_request.number}}</a></li>",
              "pr_review_comment": "<li>✍️ <b>{{human_date}}</b>: Commented on PR review <a href=\\\"{{payload.comment.html_url}}\\\">{{repo.startsWith('FreddyMSchubert/') ? repo.slice('FreddyMSchubert/'.length) : repo}}#{{payload.pull_request.number}}</a>{{(() => { const clean = s => (s || '').replace(/https?:\\/\\/[^\\s]+/gi, '*').replace(/(\\r\\n|\\n|\\r)/gm, ' ').trim(); const snippet = clean(payload.comment.body); return snippet ? ': <i>“' + (snippet.length > 50 ? snippet.slice(0,50) + '…' : snippet) + '”</i>' : ''; })()}}</li>"
            }

      - name: Commit updated README 📖
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update activity widget"

      - name: Push changes 🔼
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
